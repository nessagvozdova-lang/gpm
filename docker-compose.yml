services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store_dev_password
      POSTGRES_DB: maison_voyage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d maison_voyage"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
